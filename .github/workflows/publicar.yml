name: Publicar carrusel OMX del día

on:
  schedule:
    - cron: "0 1 * * *"    # 01:00 UTC = 19:00 CDMX (lunes a viernes)
    - cron: "0 15 * * *"   # 15:00 UTC = 09:00 CDMX (sábados)
  workflow_dispatch:        # botón "Run workflow" para pruebas manuales
    inputs:
      orden:
        description: "Número de post a publicar (vacío = el que toca hoy)"
        required: false
      dry_run:
        description: "1 = solo simular, no publica"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar en Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ORDEN: ${{ github.event.inputs.orden }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python publicar.py
      - name: Guardar registro de publicados
        run: |
          git config user.name "publicador-bot"
          git config user.email "actions@users.noreply.github.com"
          git add publicados.json
          git diff --cached --quiet || (git commit -m "Registro: post publicado" && git push)
